[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workplace-compliance-desk"
version = "0.1.0"
description = "Cited, in-force HR compliance advisory service with multi-agent verification"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "faiss-cpu>=1.8,<2.0",
  "langgraph>=0.2.60,<2.0",
  "prometheus-client>=0.20,<1.0",
  "PyYAML>=6.0,<7.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.48b0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "locust>=2.31,<3.0",
  "ruff>=0.6,<1.0",
]
ml = [
  "sentence-transformers>=3.0,<6.0",
]

[project.scripts]
compliance = "compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/compliance/api.py" = ["B008"]
